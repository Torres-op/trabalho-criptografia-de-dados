{% load static %}<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Mensagens Criptografadas{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'messenger/css/app.css' %}">
</head>
<body>
  <header class="topbar">
    <span class="brand">msgenc</span>
    <nav>
      <a href="{% url 'messenger:compose' %}"
         class="{% if request.resolver_match.url_name == 'compose' %}active{% endif %}">Compor</a>
      <a href="{% url 'messenger:translator' %}"
         class="{% if request.resolver_match.url_name == 'translator' %}active{% endif %}">Tradutor</a>
      <form method="post" action="{% url 'messenger:logout' %}" class="logout-form">
    {% csrf_token %}
        <button type="submit" class="link-button">Sair</button>
      </form>
    </nav>
  </header>

  <div id="notices" class="warning" hidden></div>

  <main>
    {% block content %}{% endblock %}
  </main>

  {% block scripts %}{% endblock %}
</body>
</html>
