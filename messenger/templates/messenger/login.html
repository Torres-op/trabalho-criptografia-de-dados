{% extends "messenger/base.html" %}

{% block title %}Entrar — Treehash{% endblock %}

{% block content %}
<div class="login-card">
  <h1>Entrar</h1>

  {% if form.errors %}
  <p class="status status--error">Usuário ou senha incorretos.</p>
  {% endif %}

  <form method="post" action="{% url 'messenger:login' %}">
    {% csrf_token %}

    <label for="{{ form.username.id_for_label }}">Usuário</label>
    {{ form.username }}

    <label for="{{ form.password.id_for_label }}">Senha</label>
    {{ form.password }}

    <input type="hidden" name="next" value="{{ next }}">

    <button type="submit">Entrar</button>
  </form>
</div>
{% endblock %}
