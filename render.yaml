databases:
  - name: treehash-db
    databaseName: treehash
    user: treehash
    plan: free
    region: ohio

services:
  - type: web
    name: treehash
    branch: main
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: ohio
    healthCheckPath: /login/
    autoDeploy: false
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: treehash-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: ALLOWED_HOSTS
        value: treehash.onrender.com
      - key: WEB_CONCURRENCY
        value: "1"
      - key: WEB_THREADS
        value: "4"
      - key: LOG_LEVEL
        value: INFO
      - key: SEED_USER_A
        sync: false
      - key: SEED_PASS_A
        sync: false
      - key: SEED_USER_B
        sync: false
      - key: SEED_PASS_B
        sync: false
